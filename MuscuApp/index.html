<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dko">
<meta name="theme-color" content="#070707">
<meta name="description" content="Dko — suivi d'entraînement musculation : séances, progression, records.">
<title>Dko</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="./app.overrides.css">
<link rel="stylesheet" href="./coach.css">
</head>
<body>

<div id="splash">
  <div class="splogo"><img src="./icons/icon-512.png" alt="" decoding="async"></div>
  <div class="spname">DKO</div>
  <div class="sptag">TRAINING</div>
</div>

<main id="app"></main>

<div id="timerbar">
  <div id="tleft" class="num">3:00</div>
  <div id="tlabel">Repos</div>
  <button class="tact" id="tminus" aria-label="Retirer 30 secondes">−30 s</button>
  <button class="tact" id="tplus" aria-label="Ajouter 30 secondes">+30 s</button>
  <button class="tact" id="tskip" aria-label="Terminer le repos" title="Terminer le repos"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="./icons/ui.svg#x"></use></svg></button>
</div>

<nav id="tabbar" aria-label="Navigation principale">
  <button class="tabbtn on" data-v="home">
    <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="./icons/ui.svg#dumbbell"></use></svg>
    <span>Entraîner</span>
  </button>
  <button class="tabbtn" data-v="programs">
    <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="./icons/ui.svg#layout-list"></use></svg>
    <span>Programmes</span>
  </button>
  <button class="tabbtn" data-v="suivi">
    <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="./icons/ui.svg#chart-no-axes-combined"></use></svg>
    <span>Suivi</span>
  </button>
</nav>

<div id="overlay"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-hidden="true" inert></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="./data-integrity.js" defer></script>
<script src="./supabase-config.js" defer></script>
<script src="./vendor/supabase-2.116.0.js" defer></script>
<script src="./cloud-sync.js" defer></script>
<script src="./coach-sync.js" defer></script>
<script src="./bodymap.js" defer></script>
<script src="./exercise-catalog.js" defer></script>
<script src="./app.js" defer></script>
<script src="./cloud-ui.js" defer></script>
<script src="./coach-ui.js" defer></script>
</body>
</html>
